version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bot-manager-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bot_manager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  bot:
    build: .
    container_name: bot-manager
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bot_manager
      - MANAGER_BOT_TOKEN=${MANAGER_BOT_TOKEN}
      - MANAGER_CLIENT_ID=${MANAGER_CLIENT_ID}
      - MANAGER_GUILD_ID=${MANAGER_GUILD_ID}
      - PIX_WEBHOOK_SECRET=${PIX_WEBHOOK_SECRET}
      - LOG_LEVEL=info
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - bot-network

volumes:
  postgres_data:

networks:
  bot-network:
    driver: bridge
